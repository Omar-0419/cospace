
name: CoSpace CD

on:
  workflow_run:
    workflows: ["CoSpace CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Deploy to AWS EC2
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest

    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Configure known hosts
        env:
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -o StrictHostKeyChecking=yes -o BatchMode=yes "$EC2_USER@$EC2_HOST" '
            set -e
            cd /home/ubuntu/cospace
            git pull --ff-only origin main
            npm ci
            npx prisma generate
            npm run build
            pm2 restart cospace --update-env
          '
